[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assembly-aware-tiling"
version = "0.1.0"
description = "Assembly-aware tiling for standing polyominoes"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jax[cuda13]==0.9.2; sys_platform == 'linux'",
    "jax==0.9.2; sys_platform != 'linux'",
    "jaxlib==0.9.2",
    "jax-cuda13-plugin==0.9.2; sys_platform == 'linux'",
    "jax-cuda13-pjrt==0.9.2; sys_platform == 'linux'",
    "numpy==2.4.4",
    "dm-haiku==0.0.16",
    "optax==0.2.8",
    "mctx==0.0.6",
    "torch",
    "warp-lang==1.12.1",
    "matplotlib==3.10.8",
    "Pillow==12.2.0",
    "scipy==1.17.1",
    "scikit-image==0.26.0",
    "seaborn==0.13.2",
    "wandb==0.25.1",
    "PyYAML==6.0.3",
    "pyglet==2.1.14",
    "viser==1.0.26",
    "trimesh==4.11.5",
    "yourdfpy==0.0.60",
    "numpy-quaternion==2024.0.13",
    "networkx==3.6.1",
    "pycollada==0.9.3",
    "usd-core==26.3",
    "newton-usd-schemas==0.1.0",
    "newton-actuators==0.1.0",
    "imgui-bundle==1.92.601",
    "cbor2==5.9.0",
    "cuda-core==0.7.0",
    "cuda-bindings==12.9.4",
    "cuda-pathfinder==1.5.4",
    "newton @ git+https://github.com/newton-physics/newton.git@8baee876dc5f001c66f1cbafec16246a3fb6f6f6",
    "nvidia-curobo @ git+https://github.com/NVlabs/curobo.git@1d6f74b94aea44063255d1db47378c80e70750e7",
]

[tool.setuptools]
py-modules = ["train_til", "infer_til", "train_seq", "infer_seq", "train_stability"]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["tiling_rl", "tiling_rl.*"]
namespaces = false
